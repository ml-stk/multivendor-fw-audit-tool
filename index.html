<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Multi-Vendor Firewall & Network Audit Tool</title>
    <link rel="stylesheet" href="style.css">
    <!-- PDF Generation Library -->
    <script src="https://cdnjs.cloudflare.com/ajax/libs/html2pdf.js/0.10.1/html2pdf.bundle.min.js"></script>
</head>
<body>
    <div class="container">
        <header>
            <h1>Network & Firewall Audit Tool</h1>
            <p>Analyze Security Policies, Routing, SD-WAN, and VPN parameters</p>
        </header>

        <main>
            <section class="upload-section" id="uploadSection">
                <div class="config-inputs">
                    <label for="vendor">Platform:</label>
                    <select id="vendor">
                        <option value="fortigate">FortiGate</option>
                        <option value="versa">Versa SD-WAN</option>
                        <option value="cisco">Cisco / Generic</option>
                    </select>

                    <label for="configFile" class="file-upload-btn">Upload Config File</label>
                    <input type="file" id="configFile" accept=".txt,.conf,.cfg">
                    <span id="fileName">No file chosen</span>
                </div>
                
                <div class="audit-modules">
                    <h3>Select Audit Modules</h3>
                    <label><input type="checkbox" id="auditSecurity" checked> Security Policies</label>
                    <label><input type="checkbox" id="auditRouting" checked> Routing (OSPF/BGP)</label>
                    <label><input type="checkbox" id="auditSdWan" checked> SD-WAN Rules</label>
                    <label><input type="checkbox" id="auditVpn" checked> VPN (IPsec/SSL)</label>
                </div>

                <button id="runAuditBtn" class="primary-btn">Run Audit</button>
            </section>

            <div id="reportContainer">
                <section id="resultsSection" class="results-section hidden" style="display: none;">
                    <div class="results-header">
                        <h2>Audit Report</h2>
                        <button id="downloadPdfBtn" class="secondary-btn">Download PDF</button>
                    </div>

                    <!-- Scorecard Metrics (Required by app.js) -->
                    <div class="scorecard">
                        <div class="score-card score-critical">Critical Risks: <span id="m-crit">0</span></div>
                        <div class="score-card score-high">High Risks: <span id="m-high">0</span></div>
                        <div class="score-card score-medium">Medium Risks: <span id="m-med">0</span></div>
                        <div class="score-card score-pass">Checks Passed: <span id="m-pass">0</span></div>
                    </div>

                    <div id="resultsContent"></div>
                </section>
            </div>
        </main>
    </div>
    <script src="app.js"></script>
</body>
</html>
