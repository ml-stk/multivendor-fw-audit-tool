<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Multi-Vendor Firewall Audit Tool</title>
    <link rel="stylesheet" href="style.css">
    <link rel="icon" href="data:,">
</head>
<body>
    <div class="container">
        <header>
            <h1>🛡️ Multi-Vendor Firewall Security Auditor</h1>
            <p>Perform zero-trust, client-side compliance and security audits across Fortinet, Cisco, Palo Alto, and more.</p>
        </header>

<div class="config-section">
            <label for="vendorSelect"><strong>Select Firewall Vendor / OS:</strong></label>
            <select id="vendorSelect">
                <option value="fortinet">Fortinet FortiOS</option>
                <option value="cisco_asa">Cisco ASA / IOS</option>
                <option value="paloalto">Palo Alto PAN-OS</option>
                <option value="meraki">Cisco Meraki (JSON)</option>
                <option value="sophos">Sophos XG/SG</option>
            </select>
        </div>

        <div class="upload-card">
            <h3>Upload Configuration File</h3>
            <p class="subtext">Supports text, configuration, or backup files (.conf, .txt, .cfg)</p>
            <input type="file" id="configFile" accept=".conf,.txt,.cfg">
        </div>

<div class="controls-center">
            <button id="auditBtn" class="btn">Run Security Audit</button>
        </div>

        <div id="outputArea" class="hidden">
            <div id="resultsContainer"></div>
        </div>
    </div>
    <script src="app.js"></script>
</body>
</html>
